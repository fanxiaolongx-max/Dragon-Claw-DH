<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="js/shared/dh-runtime.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据探索 - Dragon Claw</title>
    <style>
        :root { --line: #e3e6eb; --ink: #1c2430; --ink2: #5b6573; --bg: #f6f7f9; --accent: #1f6feb; --bad: #b42318; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; font: 14px/1.5 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); }
        header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line); }
        header a { color: var(--accent); text-decoration: none; }
        header b { font-size: 16px; }
        header small { color: var(--ink2); margin-left: auto; }
        main { flex: 1; display: flex; min-height: 0; }
        aside { width: 270px; flex: none; display: flex; flex-direction: column; background: #fff; border-right: 1px solid var(--line); }
        aside input { margin: 10px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
        #tables { flex: 1; overflow: auto; padding: 0 6px 10px; }
        .tbl { display: block; width: 100%; text-align: left; padding: 7px 10px; border: 0; border-radius: 8px; background: none; font: inherit; color: inherit; cursor: pointer; }
        .tbl:hover { background: #f1f4f8; }
        .tbl.is-active { background: #e8f0fe; }
        .tbl code { font-size: 13px; }
        .tbl span { display: block; font-size: 12px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        section { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 12px 16px; gap: 10px; }
        #cols { font-size: 12px; color: var(--ink2); max-height: 76px; overflow: auto; }
        #cols code { display: inline-block; margin: 0 6px 4px 0; padding: 1px 6px; border-radius: 6px; background: #eef1f5; color: var(--ink); }
        #cols code.heavy { background: #fff1e6; }
        textarea { width: 100%; height: 110px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; resize: vertical; }
        .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        button.act { padding: 7px 16px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font: inherit; cursor: pointer; }
        button.act.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        button.act:disabled { opacity: .5; cursor: default; }
        #status { color: var(--ink2); font-size: 13px; }
        #status.bad { color: var(--bad); }
        #result { flex: 1; min-height: 0; overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
        table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
        th, td { padding: 6px 10px; border-bottom: 1px solid #eef0f3; text-align: left; white-space: nowrap; max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
        th { position: sticky; top: 0; background: #f8f9fb; font-weight: 600; }
        td.null { color: #a0a7b2; font-style: italic; }
        .empty { padding: 40px; text-align: center; color: var(--ink2); }
        @media (max-width: 760px) { main { flex-direction: column; } aside { width: auto; max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); } }
    </style>
</head>
<body>
<header><a href="./">← 返回首页</a><b>🗂 数据探索</b><small>只读查询 · 仅限业务表 · 单次最多 500 行</small></header>
<main>
    <aside>
        <input id="filter" type="search" placeholder="搜索表名或说明" aria-label="搜索表">
        <div id="tables"><div class="empty">正在加载…</div></div>
    </aside>
    <section>
        <div id="cols">从左侧选一张表，或直接写一条 SELECT。</div>
        <textarea id="sql" spellcheck="false" placeholder="SELECT ... FROM ...（只支持只读 SELECT，MySQL 8 语法）" aria-label="SQL"></textarea>
        <div class="bar">
            <button class="act primary" id="run" type="button">运行（Ctrl+Enter）</button>
            <button class="act" id="csv" type="button" disabled>导出 CSV</button>
            <span id="status"></span>
        </div>
        <div id="result"><div class="empty">查询结果会显示在这里</div></div>
    </section>
</main>
<script>
(function () {
    const $ = (id) => document.getElementById(id);
    const state = { tables: [], active: '', rows: [], columns: [] };
    const api = async (path, options) => {
        const res = await fetch(path, { credentials: 'same-origin', ...options });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        return data;
    };
    const el = (tag, props, children) => {
        const node = Object.assign(document.createElement(tag), props || {});
        for (const child of children || []) node.append(child);
        return node;
    };
    function renderTables() {
        const q = $('filter').value.trim().toLowerCase();
        const list = state.tables.filter((t) => !q || t.name.includes(q) || String(t.note || '').toLowerCase().includes(q));
        $('tables').replaceChildren(...(list.length ? list.map((t) => {
            const btn = el('button', { type: 'button', className: 'tbl' + (t.name === state.active ? ' is-active' : ''), title: t.note || '' }, [el('code', { textContent: t.name }), el('span', { textContent: t.note || '' })]);
            btn.addEventListener('click', () => pick(t));
            return btn;
        }) : [el('div', { className: 'empty', textContent: '没有匹配的表' })]));
    }
    function pick(table) {
        state.active = table.name;
        renderTables();
        $('cols').replaceChildren(...table.columns.map((c) => el('code', { className: c.heavy ? 'heavy' : '', textContent: c.name + ' ' + c.type.toLowerCase(), title: c.heavy ? '大字段：默认不查，需要时请单独指定' : '' })));
        const light = table.columns.filter((c) => !c.heavy).map((c) => '`' + c.name + '`');
        $('sql').value = 'SELECT ' + (light.length === table.columns.length ? '*' : light.join(', ')) + '\nFROM `' + table.name + '`\nLIMIT 50';
        run();
    }
    const show = (value) => (value === null || value === undefined ? null : (typeof value === 'object' ? JSON.stringify(value) : String(value)));
    function renderResult() {
        if (!state.rows.length) { $('result').replaceChildren(el('div', { className: 'empty', textContent: '没有符合条件的数据' })); return; }
        const head = el('tr', null, state.columns.map((c) => el('th', { textContent: c })));
        const body = state.rows.map((row) => el('tr', null, state.columns.map((c) => {
            const text = show(row[c]);
            return el('td', text === null ? { className: 'null', textContent: 'NULL' } : { textContent: text.length > 300 ? text.slice(0, 300) + '…' : text, title: text.slice(0, 2000) });
        })));
        $('result').replaceChildren(el('table', null, [el('thead', null, [head]), el('tbody', null, body)]));
    }
    async function run() {
        const sql = $('sql').value.trim();
        if (!sql) return;
        $('run').disabled = true;
        $('status').className = '';
        $('status').textContent = '查询中…';
        const started = performance.now();
        try {
            const data = await api('api/db-explorer/query', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sql: sql, limit: 500 }) });
            state.rows = Array.isArray(data.rows) ? data.rows : [];
            state.columns = state.rows.length ? Object.keys(state.rows[0]) : [];
            $('status').textContent = (data.rowCount ?? state.rows.length) + ' 行 · ' + Math.round(performance.now() - started) + ' ms' + (data.note ? ' · ' + data.note : '') + (data.memoryMode ? ' · ' + data.memoryMode : '');
            renderResult();
        } catch (error) {
            state.rows = []; state.columns = [];
            $('status').className = 'bad';
            $('status').textContent = error.message;
            $('result').replaceChildren(el('div', { className: 'empty', textContent: '查询没有成功，请按上面的提示修改后重试' }));
        } finally {
            $('run').disabled = false;
            $('csv').disabled = !state.rows.length;
        }
    }
    function exportCsv() {
        const cell = (value) => { const text = show(value) ?? ''; return /[",\n\r]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text; };
        const lines = [state.columns.map(cell).join(',')].concat(state.rows.map((row) => state.columns.map((c) => cell(row[c])).join(',')));
        const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
        const link = el('a', { href: URL.createObjectURL(blob), download: (state.active || 'query') + '-' + new Date().toISOString().slice(0, 10) + '.csv' });
        document.body.append(link); link.click(); link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    }
    $('filter').addEventListener('input', renderTables);
    $('run').addEventListener('click', run);
    $('csv').addEventListener('click', exportCsv);
    $('sql').addEventListener('keydown', (event) => { if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') { event.preventDefault(); run(); } });
    api('api/db-explorer/tables').then((data) => { state.tables = data.tables || []; renderTables(); })
        .catch((error) => $('tables').replaceChildren(el('div', { className: 'empty', textContent: '加载失败：' + error.message })));
})();
</script>
</body>
</html>
